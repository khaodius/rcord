[package]
name = "rcord"
description = "A fast, native Discord client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "rcord"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_http_client = "0.2.2"
http.workspace = true
parking_lot.workspace = true
qrcode.workspace = true
rcord-auth.workspace = true
rcord-gateway.workspace = true
rcord-markup.workspace = true
rcord-model.workspace = true
rcord-rest.workspace = true
rcord-settings.workspace = true
rcord-store.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation = "1.12"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true

[package.metadata.deb]
name = "rcord"
maintainer = "khaodius <72529959+khaodius@users.noreply.github.com>"
copyright = "khaodius"
license-file = ["../../LICENSE", "0"]
extended-description = "rcord is a native Discord client written in Rust with GPUI."
section = "net"
priority = "optional"
depends = "$auto, libvulkan1"
recommends = "gnome-keyring | kwalletmanager"
assets = [
    ["target/release/rcord", "usr/bin/", "755"],
    ["target/release/rcord-webview", "usr/bin/", "755"],
    ["../../packaging/linux/rcord.desktop", "usr/share/applications/", "644"],
    ["../../assets/icons/rcord-32.png", "usr/share/icons/hicolor/32x32/apps/rcord.png", "644"],
    ["../../assets/icons/rcord-64.png", "usr/share/icons/hicolor/64x64/apps/rcord.png", "644"],
    ["../../assets/icons/rcord-128.png", "usr/share/icons/hicolor/128x128/apps/rcord.png", "644"],
    ["../../assets/icons/rcord-256.png", "usr/share/icons/hicolor/256x256/apps/rcord.png", "644"],
    ["../../assets/icons/rcord-512.png", "usr/share/icons/hicolor/512x512/apps/rcord.png", "644"],
]

[package.metadata.generate-rpm]
name = "rcord"
summary = "A fast, native Discord client"
license = "Apache-2.0"
assets = [
    { source = "target/release/rcord", dest = "/usr/bin/rcord", mode = "755" },
    { source = "target/release/rcord-webview", dest = "/usr/bin/rcord-webview", mode = "755" },
    { source = "packaging/linux/rcord.desktop", dest = "/usr/share/applications/rcord.desktop", mode = "644" },
    { source = "assets/icons/rcord-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/rcord.png", mode = "644" },
    { source = "assets/icons/rcord-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/rcord.png", mode = "644" },
    { source = "assets/icons/rcord-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/rcord.png", mode = "644" },
    { source = "assets/icons/rcord-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/rcord.png", mode = "644" },
    { source = "assets/icons/rcord-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/rcord.png", mode = "644" },
]
auto-req = "auto"
